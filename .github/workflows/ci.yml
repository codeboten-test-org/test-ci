name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Skip when running in a fork
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: echo "Running in ${{ github.repository }}"
